services:
  fotostudioh-agent:
    # Arch Linux only ships amd64 manifests — force the platform so Apple
    # Silicon hosts build/run via Rosetta 2 emulation. Native linux/amd64
    # hosts treat this as a no-op.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fotostudioh-agent
    restart: unless-stopped
    working_dir: /work
    volumes:
      - ../work:/work
      - ../agents:/agents
      - ../assets:/assets
      - ../docs:/docs                   # spec + system-level issues (writable — agent files cross-project + capability-matrix issues here)
      - ../reference:/reference:ro      # articles + arXiv PDF — agent context, read-only
      - claude-config:/root/.claude
      - pacman-cache:/var/cache/pacman/pkg
      - hf-models:/root/.cache          # whisper + huggingface model cache (~3-10 GB)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - API_TIMEOUT_MS=12000000          # 200 minutes — helps with Lite plan delays
      - CLAUDE_PROJECT_LABEL=FotoStudioH
      # ─── NVIDIA GPU passthrough (Linux + NVIDIA driver + nvidia-container-toolkit only)
      # On macOS or Linux WITHOUT NVIDIA, leave these COMMENTED OUT (the default) —
      # Docker errors out at startup if it can't fulfill the reservation. The
      # container runs CPU-only and works fine, just slower (faster-whisper
      # falls back to CPU, ffmpeg falls back to libx264 software encode).
      #
      # To enable GPU acceleration: uncomment the two NVIDIA_* env vars below
      # AND the entire `deploy:` block. Verify with:
      #   docker run --rm --gpus all nvidia/cuda:12.1.0-base-ubuntu22.04 nvidia-smi
      #
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,graphics
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    tty: true
    stdin_open: true

volumes:
  claude-config:
  pacman-cache:
  hf-models:
